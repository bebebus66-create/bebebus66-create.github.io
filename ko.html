<h1>AnimeX에서 짧은 드라마를 회차별로 보기</h1>
<p>AnimeX(动漫星球)는 애니메이션과 세로형 짧은 드라마를 회차별로 볼 수 있는 중국어 서비스입니다. 첫 화는 무료라서 작품을 먼저 확인할 수 있습니다. 이 안내 페이지는 AnimeX 운영자가 작성했습니다.</p>
<p>예를 들어 <a href="https://www.dh.video/video/creator-work-1788294358091856974">《循环告白》 제1화</a>처럼 작품과 회차별로 페이지가 나뉘어 있어, 보고 싶은 회차를 바로 찾을 수 있습니다.</p>
